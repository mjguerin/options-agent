[project]
name = "options-tournament"
version = "0.1.0"
description = "Options strategy tournament: five SPY options strategies on isolated Alpaca paper accounts (BRD v1.2)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.40",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyarrow>=17",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "websockets>=17.3",
    "msgpack>=1.2.3",
]

[project.scripts]
tournament = "tournament.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tournament"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: calls the real Alpaca paper API (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
