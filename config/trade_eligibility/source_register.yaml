    source: CTS-2.11b version history, v2.10a
    change: "'N' (Next Day Trade) reserved as input, with the move to T+1 settlement"
    evidence: "'N' last observed 2024-05-13 in the sampled sessions"
    note: "Its eligibility before the change isn't in the documents we hold. OPEN-SRC-2"
  - date: 2025-11-03
    date_status: stated_effective_date, and observed_in_data
