    source: CTS-2.11b version history, v2.10
    change: "Market Center Opening Trade 'O' made always Last eligible"
    note: "The implementation date may differ from the document date. The rule before it is not in the documents we hold (needs CTS 2.9g). OPEN-SRC-1"
  - date: 2024-05-28
