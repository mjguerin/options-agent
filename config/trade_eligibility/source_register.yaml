provider_encoding:
  provider: Alpaca historical and streaming trades
  fields: {condition_list: c, tape: z, exchange: x, trade_id: i}
  observed_encoding: >
    The condition list holds the category-1 character (a space for regular settlement, or C/N/R)
    followed by each non-space code of categories 2-4, in category order. Example: [" ", "4", "I"]
    is CTS field " 4 I". Verified against all 42 combinations seen in 70 sampled sessions.
  per_trade_sip_indicators: >
    CTS publishes a Consolidated High/Low/Last Indicator on each trade message. Alpaca doesn't
    pass it through, so eligibility is derived from the conditions and the matrix.

effective_dated_events:   # rule or market-structure changes inside the history (2024-02-01 onward)
